[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-organizer"
version = "0.1.0"
description = "Organizer tool for the geo ecosystem's AI tooling — generates Claude Code skills, agent definitions, and MCP servers consumed by geo-builder and geo-browser."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
]

[project.scripts]
geo-organizer = "geo_organizer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
