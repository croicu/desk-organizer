[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "desk-organizer"
version = "0.1.0"
description = "Personal authoring hub for AI tooling — generates Claude Code skills, agent definitions, and MCP servers for whichever of your projects need them."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
]

[project.scripts]
desk-organizer = "desk_organizer.cli:main"
desk-pager = "desk_organizer.mcp.pager.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "desk-organizer[pager]",
]
pager = [
    "mcp>=2,<3",
    "requests>=2.31",
]

[tool.setuptools.package-data]
desk_organizer = ["skills/**/*.md", "skills/skills.json"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
